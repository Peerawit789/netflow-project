global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "matrix-builder"
    static_configs:
      - targets: ["matrix-builder:8000"]

  - job_name: "ml-engine"
    static_configs:
      - targets: ["ml-engine:8001"]
